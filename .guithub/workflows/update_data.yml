name: Auto Update Multihazard Data

on:
  schedule:
    - cron: '0 * * * *' # Runs automatically every single hour
  workflow_dispatch: # Allows you to run it manually from GitHub anytime

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Data Engine
      run: python generate_data.py

    - name: Commit and Push Updated JSON
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@://github.com"
        git add public/dashboard_data.json
        git diff-index --quiet HEAD || git commit -m "Automated live data sync [skip ci]"
        git push
